<!DOCTYPE html>
<html>
<head>
<title>Fighter Jet Database</title>

<style>

body{
font-family:Arial;
background:#0b0f1a;
color:white;
text-align:center;
}

input{
width:320px;
padding:10px;
font-size:16px;
margin-top:20px;
}

.result{
background:#1b2338;
margin:10px auto;
padding:12px;
width:320px;
border-radius:8px;
cursor:pointer;
}

.result:hover{
background:#2a3558;
}

#jetPage{
display:none;
padding:40px;
}

#homePage{
padding-top:40px;
}

button{
padding:10px 20px;
margin-top:20px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="homePage">

<h1>Fighter Jet Database</h1>

<input id="search" placeholder="Search fighter jet..." oninput="searchJets()">

<div id="results"></div>

</div>


<div id="jetPage">

<div id="jetInfo"></div>

<button onclick="goHome()">⬅ Back</button>

</div>


<script>

const jets = [

{
id:"f22",
name:"F-22 Raptor",
country:"United States",
role:"Air Superiority Fighter",
speed:"Mach 2.25",
weapons:"AIM-120, AIM-9, 20mm cannon",
info:"A 5th generation stealth fighter built for air dominance."
},

{
id:"f35",
name:"F-35 Lightning II",
country:"United States",
role:"Multirole Stealth Fighter",
speed:"Mach 1.6",
weapons:"Missiles, bombs, 25mm cannon",
info:"Advanced stealth fighter used by many allied nations."
},

{
id:"f16",
name:"F-16 Fighting Falcon",
country:"United States",
role:"Multirole Fighter",
speed:"Mach 2.05",
weapons:"Missiles, bombs, 20mm cannon",
info:"One of the most widely used fighters in the world."
},

{
id:"j20",
name:"J-20 Mighty Dragon",
country:"China",
role:"Stealth Fighter",
speed:"Mach 2",
weapons:"PL-15 missiles",
info:"China's first operational stealth fighter."
}

];

function searchJets(){

let input=document.getElementById("search").value.toLowerCase();
let results=document.getElementById("results");

results.innerHTML="";

jets.forEach(jet=>{

if(jet.name.toLowerCase().includes(input)){

results.innerHTML+=`
<div class="result" onclick="openJet('${jet.id}')">
${jet.name}
</div>
`;

}

});

}

function openJet(id){

let jet=jets.find(j=>j.id===id);

document.getElementById("homePage").style.display="none";
document.getElementById("jetPage").style.display="block";

document.getElementById("jetInfo").innerHTML=`

<h1>${jet.name}</h1>

<p><b>Country:</b> ${jet.country}</p>
<p><b>Role:</b> ${jet.role}</p>
<p><b>Top Speed:</b> ${jet.speed}</p>
<p><b>Weapons:</b> ${jet.weapons}</p>

<p>${jet.info}</p>

`;

}

function goHome(){

document.getElementById("jetPage").style.display="none";
document.getElementById("homePage").style.display="block";

}

searchJets();

</script>

</body>
</html>
