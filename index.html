<!DOCTYPE html>

<style>

header{background:#111;color:white;padding:20px;text-align:center;}
section{padding:40px;text-align:center;}
button{padding:12px 20px;font-size:16px;cursor:pointer;margin:6px;}
#searchInput{width:60%;padding:12px;font-size:16px;margin-bottom:20px;}
.jet{background:white;margin:10px auto;padding:12px;width:60%;border-radius:6px;cursor:pointer;}
.jet:hover{background:#e5e5e5;}
#searchPage{display:none;}
#jetDetail{display:none;max-width:900px;margin:auto;background:white;padding:30px;border-radius:8px;text-align:left;}

</head>
<body>

<header>
<h1>Global Military Jet Database</h1>
</header>

<section id="homePage">
<h2>Welcome</h2>
<p>Explore military aircraft from around the world. Use the search bar to find any jet and view full specifications, history, and current in-service information.</p>
<button onclick="openSearch()">Search Aircraft</button>
</section>

<section id="searchPage">
<h2>Search Aircraft</h2>
<input id="searchInput" placeholder="Search jet (example: F16, MiG, Su27)">
<div id="filteredJets"></div>
<button onclick="goHome()">Back Home</button>
</section>

<section id="jetDetail">
<button onclick="goBack()">← Back to Search</button>
<div id="jetInfo"></div>
</section>

// SEARCH AND DISPLAY FUNCTIONS
function openSearch(){
    document.getElementById("homePage").style.display="none";
    document.getElementById("searchPage").style.display="block";
    document.getElementById("searchInput").focus();
}

function goHome(){
    document.getElementById("homePage").style.display="block";
    document.getElementById("searchPage").style.display="none";
    document.getElementById("jetDetail").style.display="none";
}

function goBack(){
    document.getElementById("jetDetail").style.display="none";
    document.getElementById("searchPage").style.display="block";
}

const searchInput=document.getElementById("searchInput");
const filteredJets=document.getElementById("filteredJets");
const jetInfo=document.getElementById("jetInfo");

searchInput.addEventListener("input",()=>{
  const query=searchInput.value.toLowerCase();
  if(!query){filteredJets.innerHTML="";return;}
  const results=jets.filter(j=>j.id.toLowerCase().includes(query)||j.name.toLowerCase().includes(query));
  filteredJets.innerHTML=results.map(j=>`<div class="jet" data-id="${j.id}">${j.name}</div>`).join("");
});

filteredJets.addEventListener("click",(e)=>{
  const id=e.target.dataset.id;
  if(!id) return;
  const jet=jets.find(j=>j.id===id);
  jetInfo.innerHTML=`
<h2>${jet.name}</h2>
<p><b>Type:</b> ${jet.type}</p>
<p><b>Developer:</b> ${jet.developer}</p>
<p><b>Country:</b> ${jet.country}</p>
<p><b>First Flight:</b> ${jet.firstFlight}</p>
<p><b>Engine:</b> ${jet.engine}</p>
<p><b>Top Speed:</b> ${jet.speed}</p>
<p><b>Range:</b> ${jet.range}</p>
<p><b>Length:</b> ${jet.length}</p>
<p><b>Wingspan:</b> ${jet.wingspan}</p>
<p><b>Height:</b> ${jet.height}</p>
<p><b>Weight:</b> ${jet.weight}</p>
<p><b>Weapons:</b> ${jet.weapons.join(", ")}</p>
<p><b>In Service:</b> ${jet.inService}</p>
<p><b>History:</b> ${jet.history}</p>
`;
  document.getElementById("searchPage").style.display="none";
  document.getElementById("jetDetail").style.display="block";
});
</script>

</body>
</html>
