// SEARCH AND DISPLAY FUNCTIONS
function openSearch(){
    document.getElementById("homePage").style.display="none";
    document.getElementById("searchPage").style.display="block";
    document.getElementById("searchInput").focus();
}

function goHome(){
    document.getElementById("homePage").style.display="block";
    document.getElementById("searchPage").style.display="none";
    document.getElementById("jetDetail").style.display="none";
}

function goBack(){
    document.getElementById("jetDetail").style.display="none";
    document.getElementById("searchPage").style.display="block";
}

const searchInput=document.getElementById("searchInput");
const filteredJets=document.getElementById("filteredJets");
const jetInfo=document.getElementById("jetInfo");

searchInput.addEventListener("input",()=>{
  const query=searchInput.value.toLowerCase();
  if(!query){filteredJets.innerHTML="";return;}
  const results=jets.filter(j=>j.id.toLowerCase().includes(query)||j.name.toLowerCase().includes(query));
  filteredJets.innerHTML=results.map(j=>`<div class="jet" data-id="${j.id}">${j.name}</div>`).join("");
});

filteredJets.addEventListener("click",(e)=>{
  const id=e.target.dataset.id;
  if(!id) return;
  const jet=jets.find(j=>j.id===id);
  jetInfo.innerHTML=`
<h2>${jet.name}</h2>
<p><b>Type:</b> ${jet.type}</p>
<p><b>Developer:</b> ${jet.developer}</p>
<p><b>Country:</b> ${jet.country}</p>
<p><b>First Flight:</b> ${jet.firstFlight}</p>
<p><b>Engine:</b> ${jet.engine}</p>
<p><b>Top Speed:</b> ${jet.speed}</p>
<p><b>Range:</b> ${jet.range}</p>
<p><b>Length:</b> ${jet.length}</p>
<p><b>Wingspan:</b> ${jet.wingspan}</p>
<p><b>Height:</b> ${jet.height}</p>
<p><b>Weight:</b> ${jet.weight}</p>
<p><b>Weapons:</b> ${jet.weapons.join(", ")}</p>
<p><b>In Service:</b> ${jet.inService}</p>
<p><b>History:</b> ${jet.history}</p>
`;
  document.getElementById("searchPage").style.display="none";
  document.getElementById("jetDetail").style.display="block";
});
</script>
